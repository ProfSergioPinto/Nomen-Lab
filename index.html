<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Nomen-Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
/* Concepto: plano de laboratorio sobre papel milimetrado; la tira de colores del indicador universal marca el avance. */
:root{
  --bg:#e9f0f7; --grid:#d3dfeb; --surface:#ffffff; --surface-2:#f1f5fa; --sel:#e3edff;
  --ink:#14213d; --ink-2:#45557a; --edge:#14213d; --line:#c9d6e4; --on-ink:#ffffff;
  --blue:#1f5fd1; --on-blue:#ffffff;
  --ok:#157a3a; --ok-bg:#d9f2e2; --bad:#b4232f; --bad-bg:#fde0e2; --warn-bg:#fff1bd;
  --t-metal:#dce8ff; --t-nm:#d6f1dd; --t-met:#fdf0bd; --t-noble:#ead9fb; --t-off:#eef2f7;
  --shadow-c:#14213d; --shadow-hard:3px 3px 0 var(--shadow-c);
  --font-display:'Unbounded','Arial Black',system-ui,sans-serif;
  --font-body:'Atkinson Hyperlegible',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:light; box-sizing:border-box;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c1424; --grid:#15223a; --surface:#131f36; --surface-2:#1a2a48; --sel:#1d3260;
    --ink:#e8eefc; --ink-2:#a3b3d6; --edge:#8296c6; --line:#2c3f64; --on-ink:#0c1424;
    --blue:#7aa8ff; --on-blue:#07122b;
    --ok:#6fdc97; --ok-bg:#12331f; --bad:#ff9099; --bad-bg:#3b1a22; --warn-bg:#3b3410;
    --t-metal:#1b2f58; --t-nm:#163a28; --t-met:#3d3512; --t-noble:#33224f; --t-off:#17233a;
    --shadow-c:#03060e; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1424; --grid:#15223a; --surface:#131f36; --surface-2:#1a2a48; --sel:#1d3260;
  --ink:#e8eefc; --ink-2:#a3b3d6; --edge:#8296c6; --line:#2c3f64; --on-ink:#0c1424;
  --blue:#7aa8ff; --on-blue:#07122b;
  --ok:#6fdc97; --ok-bg:#12331f; --bad:#ff9099; --bad-bg:#3b1a22; --warn-bg:#3b3410;
  --t-metal:#1b2f58; --t-nm:#163a28; --t-met:#3d3512; --t-noble:#33224f; --t-off:#17233a;
  --shadow-c:#03060e; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
body{
  background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px; color:var(--ink); font-family:var(--font-body); font-size:17px; line-height:1.5;
}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
sub{font-size:.62em;line-height:0;vertical-align:-.25em} sup{font-size:.62em;line-height:0;vertical-align:.5em}
.wrap{max-width:1080px;margin:0 auto;padding-block:16px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.narrow{max-width:800px;margin-inline:auto}
h1,h2,h3{text-wrap:balance}
.brand{font-family:var(--font-display);font-weight:800;font-size:clamp(2rem,9vw,3.4rem);letter-spacing:-.02em;line-height:1.05;margin:10px 0 10px}
.lead{margin:12px 0 18px;color:var(--ink-2);max-width:56ch;font-size:1.05rem}
.strip{position:relative;height:16px;border:2px solid var(--edge);border-radius:4px;
  background:linear-gradient(90deg,#e63946 0%,#f4811f 20%,#f7c600 40%,#2fa84f 60%,#2a6fdb 80%,#7b3fb8 100%);margin:14px 0 22px}
.mark{position:absolute;top:-10px;width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-top:10px solid var(--ink);transform:translateX(-50%);transition:left .55s cubic-bezier(.3,.8,.3,1)}
.mark::after{content:"";position:absolute;left:-1.5px;top:-1px;width:3px;height:22px;background:var(--ink)}

/* barra superior */
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.back{background:none;border:0;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:8px 0;min-height:44px;font-weight:700}
.who{font-size:.92rem;color:var(--ink-2);border:2px solid var(--line);border-radius:999px;padding:4px 12px}
.vtitle{font-family:var(--font-display);font-weight:700;font-size:clamp(1.25rem,5vw,1.8rem);margin:6px 0 4px}

/* inicio */
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:8px}
.card{display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--surface);border:2px solid var(--edge);border-radius:10px;box-shadow:var(--shadow-hard);padding:18px;cursor:pointer;min-height:210px}
.card:hover{background:var(--surface-2)} .card:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow-c)}
.card .num{font-family:var(--font-display);font-size:.8rem;font-weight:700;color:var(--ink-2);letter-spacing:.06em}
.card h2{font-family:var(--font-display);font-size:1.25rem;margin:0}
.card p{margin:0;color:var(--ink-2)}
.card .go{margin-top:auto;font-weight:700;display:flex;align-items:center;gap:8px}
.card .badge{align-self:flex-start;font-size:.82rem;font-weight:700;padding:2px 10px;border-radius:999px;border:2px solid var(--ok);color:var(--ok);background:var(--ok-bg)}
.foot{margin-top:26px;display:flex;flex-wrap:wrap;gap:16px;align-items:center;color:var(--ink-2);font-size:.92rem}
.link{background:none;border:0;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:8px 0;min-height:44px}

/* botones y controles */
.btn{border:2px solid var(--edge);background:var(--blue);color:var(--on-blue);font-weight:700;padding:12px 22px;border-radius:8px;box-shadow:var(--shadow-hard);cursor:pointer;min-height:48px}
.btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow-c)}
.btn.ghost{background:var(--surface);color:var(--ink)} .btn.small{min-height:40px;padding:8px 14px;box-shadow:2px 2px 0 var(--shadow-c)}
.btn:disabled{opacity:.5;cursor:not-allowed;box-shadow:none}
.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:12px}
.sheet{background:var(--surface);border:2px solid var(--edge);border-radius:8px;box-shadow:var(--shadow-hard)}
.pad{padding:18px 20px}
.note{color:var(--ink-2);font-size:.92rem;margin:12px 0 0}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:2px;background:var(--edge);border:2px solid var(--edge);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:10px 8px;font-weight:700;cursor:pointer;min-height:46px}
.seg button:hover{background:var(--surface-2)} .seg button[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--edge);border-radius:6px;background:var(--surface);padding:6px 12px;font-weight:700;cursor:pointer;min-height:40px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--on-ink)}
.field{display:flex;flex-direction:column;gap:6px;margin:0 0 14px}
.field label{font-weight:700}
.inp{width:100%;border:2px solid var(--edge);border-radius:6px;background:var(--surface);padding:10px 12px;min-height:48px}
textarea.inp{min-height:120px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85rem}
.err{color:var(--bad);font-weight:700;min-height:1.4em;margin:4px 0}

/* juego */
.gamegrid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:18px;align-items:start}
.qhead{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin:2px 0 8px}
.pbar{display:flex;gap:3px;margin:0 0 14px}
.pbar i{flex:1;height:8px;border-radius:2px;background:var(--line);border:1px solid var(--edge)}
.pbar i.ok{background:var(--ok)} .pbar i.bad{background:var(--bad)} .pbar i.cur{background:var(--blue)}
.q{padding:18px}
.ask{margin:0 0 12px;font-size:1.05rem}
.sysnote{display:inline-block;margin-left:6px;padding:1px 8px;border:2px solid var(--edge);border-radius:4px;font-size:.85rem;font-weight:700;background:var(--warn-bg)}
.tile{font-family:var(--font-display);font-weight:700;font-size:clamp(1.7rem,7vw,2.8rem);padding:16px 14px;border:2px solid var(--edge);border-radius:8px;background:var(--surface-2);text-align:center;margin:0 0 16px;overflow-wrap:anywhere}
.tile.name{font-family:var(--font-body);font-size:clamp(1.2rem,4.6vw,1.7rem)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;border:2px solid var(--edge);border-radius:8px;background:var(--surface);padding:12px;cursor:pointer;min-height:64px;box-shadow:var(--shadow-hard)}
.opt:hover:not(:disabled){background:var(--surface-2)} .opt:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow-c)}
.opt:disabled{cursor:default;color:var(--ink)}
.key{flex:none;width:30px;height:30px;display:grid;place-items:center;border:2px solid var(--edge);border-radius:6px;font-weight:700;font-size:.9rem;background:var(--surface-2)}
.otxt{flex:1;font-size:1.02rem;overflow-wrap:anywhere} .otxt.f{font-family:var(--font-display);font-size:1.05rem;font-weight:500}
.roman{color:var(--ink-2)}
.opt.ok{background:var(--ok-bg);border-color:var(--ok)} .opt.bad{background:var(--bad-bg);border-color:var(--bad);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.hdock{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:max(16px,env(safe-area-inset-bottom,0px));z-index:30;display:flex;flex-direction:column;align-items:flex-end;gap:8px;max-width:calc(100vw - 32px)}
.hbtn{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--edge);background:var(--surface);color:var(--ink);font-weight:700;padding:8px 14px;min-height:44px;border-radius:999px;box-shadow:2px 2px 0 var(--shadow-c);cursor:pointer}
.hbtn[aria-expanded="true"]{background:var(--ink);color:var(--on-ink)}
.hic{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:999px;background:var(--blue);color:var(--on-blue);font-size:.8rem;padding:0 4px}
.hpanel{position:relative;width:min(380px,calc(100vw - 32px));max-height:min(62vh,520px);overflow:auto;background:var(--surface);border:2px solid var(--edge);border-radius:10px;box-shadow:var(--shadow-hard);padding:12px 14px}
.hpanel h3{margin:0 28px 4px 0;font-size:1rem} .hpanel h4{margin:12px 0 4px;font-size:.8rem;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2)}
.hx{position:absolute;top:6px;right:6px;width:36px;height:36px;border:0;background:transparent;font-size:1rem;cursor:pointer;color:var(--ink)}
.hsteps{margin:0 0 8px;padding-left:20px} .hsteps li{margin:4px 0}
.hex{background:var(--surface-2);border:2px solid var(--line);border-radius:8px;padding:8px 10px;margin:8px 0}
.htrap{background:var(--warn-bg);border-radius:6px;padding:6px 8px;margin:8px 0 0}
.hpanel dl{margin:0} .hpanel dt{font-weight:700;margin-top:8px} .hpanel dd{margin:0 0 2px;color:var(--ink-2)}
.chip.small{min-height:36px;padding:4px 10px;font-size:.85rem}
.fb{margin-top:16px;border:2px solid var(--edge);border-radius:8px;padding:14px 16px;background:var(--surface-2)}
.fb.ok{border-color:var(--ok);background:var(--ok-bg)} .fb.bad{border-color:var(--bad);background:var(--bad-bg)}
.fb h3{margin:0 0 6px;font-size:1.05rem}
.names{width:100%;border-collapse:collapse;margin:10px 0 4px;font-size:.95rem}
.names th{text-align:left;font-size:.78rem;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);padding:4px 8px 4px 0;white-space:nowrap;vertical-align:top}
.names td{padding:4px 0;border-top:1px solid var(--line)} .names tr.hl td,.names tr.hl th{font-weight:700;color:var(--ink)}
.why{margin:8px 0 0;font-size:.95rem}

/* panel de molécula */
.panel{display:flex;flex-direction:column}
.viewer{position:relative;border-bottom:2px solid var(--edge);background:radial-gradient(circle at 50% 40%,var(--surface),var(--surface-2))}
.viewer canvas{display:block;width:100%;height:clamp(230px,38vw,330px);cursor:grab;touch-action:none;border-radius:6px 6px 0 0}
.viewer canvas:active{cursor:grabbing}
.vctl{position:absolute;right:8px;top:8px;display:flex;gap:6px}
.vctl button{border:2px solid var(--edge);background:var(--surface);border-radius:6px;min-width:40px;min-height:40px;cursor:pointer;font-weight:700}
.vhide{display:grid;place-items:center;height:clamp(230px,38vw,330px);text-align:center;color:var(--ink-2);padding:20px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;padding:8px 14px;border-bottom:2px solid var(--line);font-size:.88rem}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.4);display:inline-block}
.vnote{padding:8px 14px;font-size:.88rem;color:var(--ink-2);border-bottom:2px solid var(--line)}
.ptags{display:flex;flex-wrap:wrap;gap:8px;padding:12px 14px 0}
.tag{font-size:.82rem;font-weight:700;padding:2px 10px;border:2px solid var(--edge);border-radius:999px}
.psec{padding:12px 14px}
.psec h4{margin:0 0 6px;font-family:var(--font-display);font-size:.8rem;letter-spacing:.04em}
.uses{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.uses li{display:flex;gap:10px;align-items:flex-start}
.uses .ico{flex:none;color:var(--blue);margin-top:1px}
.fun{background:var(--warn-bg);border-radius:6px;padding:10px 12px;font-size:.95rem}
details.tips{border:2px solid var(--edge);border-radius:6px;padding:8px 12px;background:var(--surface-2)}
details.tips summary{cursor:pointer;font-weight:700;min-height:32px;display:flex;align-items:center}
details.tips ul{margin:8px 0 0;padding-left:20px}
.fbig{font-family:var(--font-display);font-weight:700;font-size:1.5rem}

/* resultados */
.score{font-family:var(--font-display);font-weight:800;font-size:clamp(2.4rem,10vw,4rem);margin:0}
.banner{padding:14px 16px;border:2px solid var(--edge);border-radius:8px;margin:10px 0}
.banner.ok{background:var(--ok-bg);border-color:var(--ok)} .banner.bad{background:var(--warn-bg)}
.tablewrap{overflow-x:auto;border:2px solid var(--edge);border-radius:8px;background:var(--surface)}
table.dt{border-collapse:collapse;width:100%;font-size:.92rem}
table.dt th,table.dt td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.dt th{background:var(--surface-2);font-size:.78rem;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
table.dt td.n{font-variant-numeric:tabular-nums;text-align:right} table.dt td.c{white-space:nowrap}
.mk-ok{color:var(--ok);font-weight:800} .mk-bad{color:var(--bad);font-weight:800}
.code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.78rem;word-break:break-all;background:var(--surface-2);border:2px dashed var(--edge);border-radius:6px;padding:10px;max-height:110px;overflow:auto}
.stats4{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:12px 0}
.stat{border:2px solid var(--edge);border-radius:8px;background:var(--surface);padding:10px 14px}
.stat b{display:block;font-family:var(--font-display);font-size:1.5rem}

/* teoría */
.tabs{margin:10px 0 16px}
.tuto h3{font-family:var(--font-display);font-size:1rem;margin:18px 0 8px}
.steps{counter-reset:s;list-style:none;margin:0;padding:0;display:grid;gap:10px}
.steps li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start}
.steps li::before{content:counter(s);display:grid;place-items:center;width:30px;height:30px;border:2px solid var(--edge);border-radius:50%;font-weight:800;background:var(--surface-2)}
.callout{border-left:6px solid var(--blue);background:var(--sel);padding:10px 14px;border-radius:0 6px 6px 0;margin:12px 0}
.ex{border:2px solid var(--edge);border-radius:8px;background:var(--surface);padding:14px;margin-top:12px}
.ex .fbig{margin-bottom:6px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.mini{border:2px solid var(--edge);border-radius:8px;background:var(--surface);padding:12px 14px}
.mini h4{margin:0 0 6px;font-family:var(--font-display);font-size:.85rem}

/* taller */
.wgrid{display:grid;grid-template-columns:minmax(0,2.15fr) minmax(0,1fr);gap:16px;align-items:start}
.ptw{overflow-x:auto;padding:10px;border:2px solid var(--edge);border-radius:8px;background:var(--surface)}
.pt{display:grid;grid-template-columns:repeat(18,minmax(34px,1fr));gap:3px;min-width:660px}
.el{position:relative;border:1.5px solid var(--edge);border-radius:4px;min-height:44px;padding:2px 0;cursor:grab;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;background:var(--t-metal);user-select:none;-webkit-user-select:none}
.el b{font-size:.92rem} .el small{font-size:.55rem;color:var(--ink-2)}
.el.nm{background:var(--t-nm)} .el.met{background:var(--t-met)} .el.noble{background:var(--t-noble)}
.el.off{background:var(--t-off);opacity:.55;cursor:not-allowed;border-style:dashed}
.el.rare{border-style:dashed;opacity:.8}
.el:hover:not(.off){outline:2px solid var(--blue)}
.pt .gap{min-height:44px}
.ions{margin-top:12px}
.ionrow{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 12px}
.ion{border:2px solid var(--edge);background:var(--surface);border-radius:6px;padding:4px 10px;cursor:grab;min-height:42px;display:inline-flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15;user-select:none}
.ion small{font-size:.68rem;color:var(--ink-2)} .ion.cat{background:var(--t-metal)} .ion.an{background:var(--t-nm)}
.centro{min-height:130px;border:3px dashed var(--edge);border-radius:10px;background:var(--surface);padding:12px;display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start}
.centro.over{background:var(--sel);border-style:solid}
.centro .empty{color:var(--ink-2);align-self:center;margin:auto;text-align:center}
.cit{display:inline-flex;align-items:center;gap:4px;border:2px solid var(--edge);border-radius:8px;background:var(--surface-2);padding:2px 4px 2px 10px}
.cit b{font-size:1.1rem;font-family:var(--font-display)} .cit .q{padding:0;font-weight:700;min-width:2ch;text-align:center}
.cit button{border:0;background:none;min-width:34px;min-height:34px;cursor:pointer;font-weight:800;font-size:1.1rem;border-radius:4px}
.cit button:hover{background:var(--line)}
.ghost-drag{position:fixed;z-index:9999;pointer-events:none;border:2px solid var(--edge);background:var(--surface);border-radius:6px;padding:6px 12px;font-weight:800;box-shadow:var(--shadow-hard)}
.res{margin-top:16px}
.sug{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.badge2{display:inline-block;font-size:.8rem;font-weight:700;padding:2px 10px;border-radius:999px;background:var(--warn-bg);border:2px solid var(--edge)}

@media (max-width:900px){
  .cards{grid-template-columns:1fr} .card{min-height:0}
  .gamegrid,.wgrid{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:520px){ .opts{grid-template-columns:1fr} .seg button{font-size:.9rem;padding:8px 4px} }
@media (prefers-reduced-motion:reduce){ .mark{transition:none} .opt.bad{animation:none} }

</style>

<script>
/* Motor de nomenclatura: genera los tres nombres (Sistemática, Stock, Tradicional) a partir de la composición. */
(function (root) {
'use strict';
const USE_ANHIDRIDO = false; // true => óxidos no metálicos tradicionales como "anhídrido sulfuroso"

const PRE = {1:'mono',2:'di',3:'tri',4:'tetra',5:'penta',6:'hexa',7:'hepta',8:'octa',9:'nona',10:'deca'};

  const grp = ch => ANIONS.filter(k => E.AN[k].ch === ch).map(k => chip('an', k, E.AN[k].st, E.AN[k].f, sg(ch, '−'), 'an')).join('');
  return '<div class="ions"><h4 style="margin:0">CATIONES</h4><div class="ionrow">' + CATIONS.map(([k, n]) => chip('cat', k, n, E.CAT[k].f, sg(k === 'Hg2' ? 2 : 1, '+'), 'cat')).join('') + '</div>' +
    '<h4 style="margin:0">ANIONES −1</h4><div class="ionrow">' + grp(1) + '</div><h4 style="margin:0">ANIONES −2</h4><div class="ionrow">' + grp(2) + '</div>' +
    '<h4 style="margin:0">ANIONES −3</h4><div class="ionrow">' + grp(3) + '</div><h4 style="margin:0">MÁS IONES</h4><div class="ionrow">' + MORE.map(k => chip('an', k, E.AN[k].st, E.AN[k].f, sg(E.AN[k].ch, '−'), 'an')).join('') + '</div></div>';
}

/* ---------- análisis ---------- */
const flat = items => { const m = {}; items.forEach(it => { const p = E.parseF(spLabel(it)); for (const e in p) m[e] = (m[e] || 0) + p[e] * it.n; }); return m; };
const red = m => { let g = 0; for (const e in m) g = E.gcd(g, m[e]); const o = {}; for (const e in m) o[e] = m[e] / (g || 1); return o; };
const same = (a, b) => { const ka = Object.keys(a), kb = Object.keys(b); return ka.length === kb.length && ka.every(k => a[k] === b[k]); };
const elset = m => Object.keys(m).sort().join(',');
function analyze(items) {
  if (!items.length) return {k:'empty'};
  const atoms = flat(items);
  const exact = E.DB.filter(c => same(c.atoms, atoms));
  if (exact.length) return {k:'hit', c:exact[0]};
  const r = red(atoms), ratio = E.DB.filter(c => same(red(c.atoms), r));
  if (ratio.length) return {k:'hit', c:ratio[0], simp:true};
  const els = items.filter(it => it.t === 'el');
  const allEl = els.length === items.length;
  if (items.length === 1 && allEl) return {k:'elem', sym:items[0].k, n:items[0].n};
  if (allEl && els.some(it => ['He', 'Ne', 'Ar'].includes(it.k))) return {k:'noble', sym:els.find(it => ['He', 'Ne', 'Ar'].includes(it.k)).k};
  if (allEl && els.some(it => RARE.has(it.k) && !E.CAT[it.k])) return {k:'synth', sym:els.find(it => RARE.has(it.k) && !E.CAT[it.k]).k};
  const cats = items.filter(it => it.t === 'cat' || (it.t === 'el' && isMetal(it.k)));
  if (allEl && cats.length === els.length && cats.length >= 2) {
    const key = els.map(it => it.k).sort().join(',');
    return {k:'alloy', info:ALLOY[key], syms:els.map(it => it.k)};
  }
  if (allEl && els.length === 2 && els.some(it => it.k === 'C') && els.some(it => isMetal(it.k)) && ALLOY[els.map(it => it.k).sort().join(',')]) return {k:'alloy', info:ALLOY[els.map(it => it.k).sort().join(',')], syms:els.map(it => it.k)};
  const ans = items.filter(it => it.t === 'an' || (it.t === 'el' && !isMetal(it.k) && E.MONO[it.k] && it.k !== 'H') || (it.t === 'el' && it.k === 'H' && cats.some(x => x.t === 'el')));
  if (cats.length === 1 && ans.length === 1 && cats.length + ans.length === items.length) {
    const C = cats[0], An = ans[0], ck = C.k, ak = An.k;
    const cat = E.CAT[ck], an = E.AN[ak]; if (cat && an) {
      const ratioU = E.gcd(C.n, An.n), u = [C.n / ratioU, An.n / ratioU];
      const opts = (cat.vals || []).map(v => ({v, f:E.ionic(ck, v, ak)}));
      const ok = opts.find(o => o.f.ions[0].n === u[0] && o.f.ions[1].n === u[1]);
      if (ok) return {k:'gen', c:ok.f, simp:false};
      return {k:'bad', why:'charges', cat, an, opts, u};
    }
  }
  if (allEl && els.length >= 2 && !cats.length) {
    const cg = E.covGen(atoms);
    if (cg && !cg.bad) return {k:'gen', c:cg, cov:true};
    if (cg && cg.bad === 'ox') { const opts = E.covOptions(cg.X, cg.Y); if (opts.length) return {k:'covbad', X:cg.X, Y:cg.Y, v:cg.v, opts}; }
  }
  const es = Object.keys(atoms);
  let sug = E.DB.filter(c => elset(c.atoms) === elset(atoms)).slice(0, 8);
  if (!sug.length) sug = E.DB.filter(c => es.every(e => c.atoms[e])).slice(0, 8);
  return {k:'none', sug, atoms};
}
function itemsOf(c) {
  if (c.ionic) return c.ions.map(i => i.k === 'c' ? {t:(E.CAT[i.key].poly || i.key === 'Hg2') ? 'cat' : 'el', k:i.key, n:i.n} : {t:E.AN[i.key].poly ? 'an' : 'el', k:i.key, n:i.n});
  return Object.keys(c.atoms).map(e => ({t:'el', k:e, n:c.atoms[e]}));
}
const fmtAtoms = items => items.map(it => (it.n > 1 ? it.n + ' × ' : '') + spLabel(it).replace(/(\d+)/g, '<sub>$1</sub>')).join(' + ');

function elemHTML(k, n) {
  const z = sym2z[k], nm = NAMES[z - 1], [r, c] = pos(z);
  const cls = classOf(k, z), st = LIQ.has(k) ? 'líquido' : GASES.has(k) ? 'gas' : 'sólido';
  const sub = SUBST[k + n], grp = (r <= 7 && c) ? (z >= 57 && z <= 71 ? 'lantánidos' : z >= 89 && z <= 103 ? 'actínidos' : 'grupo ' + c + ', periodo ' + (r > 7 ? r - 3 : r)) : '';
  const fact = I.ELINFO[k] ? '<p>' + esc(I.ELINFO[k]) + '</p>' : '';
  const body = n === 1 ? '<p>Un solo átomo de ' + nm.toLowerCase() + '. Para formar un compuesto, combínalo con otro elemento o con un ion.</p>'
    : sub ? '<p>Con ' + n + ' átomos se forma <b>' + esc(sub[0]) + '</b>, una sustancia simple (' + sub[1] + ').</p>'
    : '<p>' + n + ' átomos de ' + nm.toLowerCase() + ' juntos no forman una sustancia común. Agrega otro elemento para armar un compuesto.</p>';
  return '<div class="sheet pad"><div class="fbig" style="font-size:2rem">' + esc(k) + '</div><div class="chips" style="margin:6px 0 10px"><span class="tag">' + esc(cls) + '</span><span class="tag">Z = ' + z + '</span><span class="tag">' + st + ' a 25 °C</span></div>' +
    '<p style="margin-top:0"><b>' + esc(nm) + '</b>' + (grp ? ' · ' + grp : '') + '</p>' + fact + body + '</div>';
}

/* ---------- pantalla ---------- */
function resultHTML(a) {
  if (a.k === 'empty') return '<div class="sheet pad"><b>El Centro está vacío.</b><p class="note" style="margin:6px 0 0">Toca o arrastra elementos y iones. Prueba con Na y Cl, con H₂ y O, o con Ca y el ion OH⁻.</p></div>';
  if (a.k === 'elem') return elemHTML(a.sym, a.n);
  if (a.k === 'noble') return '<div class="sheet pad"><span class="badge2">Gas noble</span><p><b>' + esc(NAMES[sym2z[a.sym] - 1]) + '</b> tiene sus capas de electrones completas, por eso casi no reacciona: no forma compuestos conocidos con los elementos de este taller. Prueba con xenón (Xe) y flúor (F), que sí forman XeF₄.</p></div>';
  if (a.k === 'synth') return '<div class="sheet pad"><span class="badge2">Elemento sintético</span><p><b>' + esc(NAMES[sym2z[a.sym] - 1]) + '</b> solo se obtiene en aceleradores, átomo por átomo, y dura fracciones de segundo. No se conocen compuestos que se puedan nombrar con estas reglas.</p></div>';
  if (a.k === 'alloy') return '<div class="sheet pad"><span class="badge2">Mezcla de metales</span>' + (a.info ? '<p><b>' + esc(a.info[0]) + '.</b> ' + esc(a.info[1]) + '</p>' : '') +
    '<p>Los metales entre sí no se unen por cargas ni se nombran con valencias: forman <b>aleaciones</b> (mezclas) o compuestos intermetálicos. Para un compuesto con nombre, combina un metal con un no metal o con un ion de la lista.</p></div>';
  if (a.k === 'covbad') {
    const lines = a.opts.map(o => '<li>' + fF(o.f.f) + ' (' + NAMES[sym2z[a.X] - 1].toLowerCase() + ' con ' + o.v + '+)</li>').join('');
    return '<div class="sheet pad"><span class="badge2">Proporción poco habitual</span><p>Con esas cantidades de <b>' + a.X + '</b> y <b>' + a.Y + '</b> el estado de oxidación de ' + a.X + ' sería <b>' + (Number.isInteger(a.v) ? '+' + a.v : a.v) + '</b>, que no es común para ese elemento.</p>' +
      '<p style="margin-bottom:4px">Combinaciones que sí existen:</p><ul style="margin-top:4px">' + lines + '</ul><div class="sug">' + a.opts.map((o, i) => '<button class="chip" data-act="wload" data-id="" data-gen="' + i + '"><span>Probar ' + fF(o.f.f) + '</span></button>').join('') + '</div></div>';
  }
  if (a.k === 'bad') {
    const lines = a.opts.map(o => '<li>' + fF(o.f.f) + ' (' + a.cat.sym + ' con ' + o.v + '+)</li>').join('');
    return '<div class="sheet pad"><span class="badge2">Las cargas no cuadran</span><p>Con <b>' + fF(a.cat.f) + '</b> y <b>' + fF(a.an.f) + '<sup>' + sg(a.an.ch, '−') + '</sup></b> la proporción que pusiste no deja el compuesto neutro.</p>' +
      '<p style="margin-bottom:4px">Combinaciones que sí se pueden formar:</p><ul style="margin-top:4px">' + lines + '</ul><div class="sug">' + a.opts.map((o, i) => '<button class="chip" data-act="wload" data-id="' + esc(o.f.f) + '" data-gen="' + i + '"><span>Probar ' + fF(o.f.f) + '</span></button>').join('') + '</div></div>';
  }
  if (a.k === 'none') {
    const sug = a.sug.length ? '<p style="margin-bottom:6px">Compuestos de la base de datos con esos elementos:</p><div class="sug">' + a.sug.map(c => '<button class="chip" data-act="wload" data-id="' + esc(c.id) + '"><span>' + fF(c.f) + '</span></button>').join('') + '</div>' : '';
    return '<div class="sheet pad"><span class="badge2">Sin compuesto común</span><p>No encontré un compuesto común con <b>' + fmtAtoms(S.w) + '</b>. Puede que las cantidades no cuadren o que la combinación no exista.</p>' + sug + '</div>';
  }
  const c = a.c;
  const rows = SYS.map(s => '<tr><th>' + SYSN[s] + '</th><td>' + (c[s] ? nH(c[s]) : '<span class="note">Sin nombre de uso común</span>') + '</td></tr>').join('');
  const same = E.DB.filter(x => x.id !== c.id && x.elems.slice().sort().join() === c.elems.slice().sort().join()).slice(0, 8);
  const gen = a.k === 'gen';
  return '<div class="sheet pad"><div class="fbig" style="font-size:2rem">' + fF(c.f) + '</div><div class="chips" style="margin:6px 0 10px"><span class="tag">' + esc(E.FAM[c.fam]) + '</span>' + (a.simp ? '<span class="tag">Fórmula más simple de tu proporción</span>' : '') + (gen ? '<span class="tag">' + (a.cov ? 'Fórmula generada por el taller' : 'Posible por balance de cargas') + '</span>' : '') + '</div>' +
    '<h4 style="margin:0 0 4px;font-family:var(--font-display);font-size:.8rem">NOMBRE EN LOS TRES SISTEMAS</h4><table class="names">' + rows + '</table>' +
    (gen ? '<p class="note">' + (a.cov ? 'Los estados de oxidación son habituales para estos elementos, así que la fórmula es razonable. La geometría 3D es una aproximación (teoría VSEPR) y no está entre los compuestos más comunes, por eso no tiene ficha de usos.' : 'Las cargas cuadran, así que la fórmula es válida en el papel. Puede que el compuesto sea poco común o inestable en la realidad; no está entre los más comunes de la lista, por eso no tiene ficha de usos.') + '</p>' : '') +
    (same.length ? '<p style="margin:10px 0 4px"><b>Otros compuestos con los mismos elementos</b></p><div class="sug">' + same.map(x => '<button class="chip" data-act="wload" data-id="' + esc(x.id) + '"><span>' + fF(x.f) + '</span></button>').join('') + '</div>' : '') + '</div>' +
    '<div style="margin-top:14px" id="wpnl">' + panelHTML(c, {open:true}) + '</div>';
}
function upd() {
  const box = $('#centro'), res = $('#wres'); if (!box) return;
  box.innerHTML = S.w.length ? S.w.map((it, i) => '<span class="cit"><b>' + fF(spLabel(it)) + '</b>' + (spChg(it) ? '<sup>' + spChg(it) + '</sup>' : '') + '<button data-act="wdec" data-i="' + i + '" aria-label="Quitar uno">−</button><span class="q" aria-live="polite">' + it.n + '</span><button data-act="winc" data-i="' + i + '" aria-label="Añadir uno">+</button><button data-act="wdel" data-i="' + i + '" aria-label="Quitar todos">✕</button></span>').join('') : '<span class="empty">Arrastra aquí los elementos y iones<br><small>O tócalos para añadirlos</small></span>';

}
function addItem(t, k, n) {
  const f = S.w.find(i => i.t === t && i.k === k); if (f) f.n += n || 1; else S.w.push({t, k, n:n || 1});
  upd();
}

Object.assign(A.actions, {

  wclear() { S.w = []; upd(); },
  winc(b) { S.w[+b.dataset.i].n++; upd(); },
  wdec(b) { const it = S.w[+b.dataset.i]; it.n--; if (it.n <= 0) S.w.splice(+b.dataset.i, 1); upd(); },
  wdel(b) { S.w.splice(+b.dataset.i, 1); upd(); },
  wload(b) { const c = E.byId[b.dataset.id]; if (c) { S.w = itemsOf(c); upd(); } else { const a = analyze(S.w); if (a.opts) { const o = a.opts[+b.dataset.gen]; S.w = itemsOf(o.f); upd(); } } },
});
/* clic y arrastre (mouse/lápiz); en pantallas táctiles basta tocar */
let drag = null, swallow = 0;
document.addEventListener('click', e => {
  const p = e.target.closest('[data-pick]'); if (!p || S.view !== 'taller') return;
  if (Date.now() < swallow) return;
    const [t, k] = p.dataset.pick.split(':'); addItem(t, k, 1);

document.addEventListener('pointerdown', e => {
  if (S.view !== 'taller' || e.pointerType === 'touch' || e.button) return;
  const p = e.target.closest('[data-pick]'); if (!p) return;
  drag = {p, x:e.clientX, y:e.clientY, g:null};
});
document.addEventListener('pointermove', e => {
  if (!drag) return;
  if (!drag.g && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 6) {
    const g = document.createElement('div'); g.className = 'ghost-drag'; g.textContent = drag.p.dataset.pick.split(':')[1].replace(/^(NH4|H3O)$/, '$1'); document.body.appendChild(g); drag.g = g;
    const box = $('#centro'); if (box) box.classList.add('over');
  }
  if (drag.g) { drag.g.style.left = e.clientX + 12 + 'px'; drag.g.style.top = e.clientY + 12 + 'px'; e.preventDefault(); }
});
document.addEventListener('pointerup', e => {
  if (!drag) return;
  if (drag.g) {
    drag.g.remove(); const box = $('#centro'); if (box) box.classList.remove('over');
    const under = document.elementFromPoint(e.clientX, e.clientY);
    if (under && under.closest('#centro, #wres, .wgrid > div:last-child')) { const [t, k] = drag.p.dataset.pick.split(':'); addItem(t, k, 1); }
    swallow = Date.now() + 80;
  }
  drag = null;
});

}

    '<div class="actions"><button class="btn" data-act="tcopy">Copiar para Excel</button><button class="btn ghost" data-act="tdel">' + (TS.confirm ? 'Confirmar: borrar todo' : 'Borrar datos') + '</button>' + (TS.confirm ? '<button class="btn ghost" data-act="tno">Cancelar</button>' : '') + '</div><div class="note" id="tcm" role="status"></div>' +
    '<p class="note">Los códigos detectan errores de copia, pero no están protegidos contra alteraciones. Para trabajos con nota, pide además la captura de la pantalla de resultados.</p>', {mark:90});
};
Object.assign(A.actions, {
  tadd() {
    const txt = $('#tpaste').value, toks = txt.split(/\s+/).filter(t => t.startsWith('NL1.'));
    const cur = loadRecs(), keys = new Set(cur.map(r => r.k)); let add = 0, dup = 0, bad = 0;
    toks.forEach(t => { const r = A.parseCode(t); if (!r || r.bad) { bad++; return; } const k = t.slice(4, 40) + t.slice(-6); const rr = Object.assign({}, r, {k}); if (keys.has(k)) dup++; else { keys.add(k); cur.push(rr); add++; } });
    store.set('teacher', cur);
    TS.msg = toks.length ? (add + ' agregados' + (dup ? ', ' + dup + ' repetidos' : '') + (bad ? ', ' + bad + ' dañados o inválidos' : '') + '.') : 'No encontré códigos que empiecen con NL1.';
    A.views.profesor();
  },
  tsec(b) { TS.sec = b.dataset.k; A.views.profesor(); },
  tdel() { if (!TS.confirm) { TS.confirm = true; } else { store.set('teacher', []); TS.confirm = false; TS.msg = 'Datos borrados.'; } A.views.profesor(); },
  tno() { TS.confirm = false; A.views.profesor(); },
  tcopy() {
    const recs = loadRecs().filter(r => TS.sec === 'Todos' || r.s === TS.sec);
    const head = ['Fecha', 'Estudiante', 'Grupo', 'Intento', 'Aciertos', 'Total', 'Segundos', 'Pistas', 'Fallos'].join('\t');
    const body = recs.map(r => [r.d.replace('T', ' '), r.n, r.s, r.a, r.p, 20, r.t, r.h, r.e.join(' ')].join('\t')).join('\n');
    A.copy(head + '\n' + body, $('#tcm'), 'Tabla copiada. Pégala en Excel o Google Sheets.');
  },
});
})();

/* ---------- Vocabulario ---------- */

const ln = s => s.toLowerCase();
function vocabHTML(q) {

/* ---------- Ayuda ---------- */
const SUBS = '₀₁₂₃₄₅₆₇₈₉';
function leaks(q, t) { // evita que la ayuda revele la respuesta de la pregunta actual
  const c = q.c, low = t.toLowerCase(), sub = c.f.replace(/\d/g, d => SUBS[d]);
  if (t.includes(sub) || t.includes(c.f)) return true;
  return ['sis', 'st', 'tr'].some(k => c[k] && low.includes(c[k].toLowerCase()));
}
function helpHTML(q) {
  const F = dataFor(q.c), sk = S.helpSys || q.sys;
  const tabs = ['sis', 'st', 'tr'].map(k => '<button class="chip small" data-act="hsys" data-k="' + k + '" aria-pressed="' + (k === sk) + '">' + SYSN[k] + '</button>').join('');
  const steps = (F[sk] || []).filter(t => !leaks(q, t)).map(t => '<li>' + esc(E.cap(t)) + '</li>').join('');
  const forms = q.type === 'n2f' && F.formula ? '<details><summary>Para escribir la fórmula</summary><ol>' + F.formula.filter(t => !leaks(q, t)).map(t => '<li>' + esc(E.cap(t)) + '</li>').join('') + '</ol></details>' : '';
  const exId = (F.ex || []).find(f => f !== q.c.f && E.byId[f] && E.byId[f][sk]) || (F.ex || []).find(f => f !== q.c.f && E.byId[f]);
  const ex = exId ? E.byId[exId] : null;
  const exHTML = ex ? '<div class="hex"><b>Ejemplo del mismo tipo</b><div class="fbig" style="font-size:1.2rem;margin:4px 0">' + fF(ex.f) + '</div><table class="names">' +
    ['sis', 'st', 'tr'].map(k => '<tr class="' + (k === sk ? 'hl' : '') + '"><th>' + SYSN[k] + '</th><td>' + (ex[k] ? nH(ex[k]) : '<span class="note">Sin nombre de uso común</span>') + '</td></tr>').join('') + '</table></div>' : '';
  return '<h3>Ayuda: ' + esc(F.t) + '</h3><p class="note" style="margin:0 0 8px">' + esc(E.cap(F.sub || '')) + '</p><div class="chips" style="margin-bottom:8px">' + tabs + '</div>' +
    '<ol class="hsteps">' + (steps || '<li>No hay pasos para este caso.</li>') + '</ol>' + forms + exHTML + (F.trap && !leaks(q, F.trap) ? '<p class="htrap"><b>Ojo:</b> ' + esc(F.trap) + '</p>' : '');
}
function drawDock() {
  const box = A.$('#hdock'); if (!box) return;
  const g = S.game; if (!g || g.done) { box.innerHTML = ''; return; }
  const q = g.qs[g.i], open = S.hopen;
  if (S.hq !== q) { S.hq = q; S.helpSys = null; }
  const body = open === 'ayuda' ? helpHTML(q) : open === 'vocab' ? vocabHTML(q) : '';
  box.innerHTML = (open ? '<div class="hpanel" id="hpanel" role="region" aria-label="' + (open === 'ayuda' ? 'Ayuda' : 'Vocabulario') + '"><button class="hx" data-act="hclose" aria-label="Cerrar">✕</button>' + body + '</div>' : '') +
    '<button class="hbtn" data-act="hopen" data-k="ayuda" aria-expanded="' + (open === 'ayuda') + '"><span class="hic">?</span>Ayuda</button>' +
    '<button class="hbtn" data-act="hopen" data-k="vocab" aria-expanded="' + (open === 'vocab') + '"><span class="hic">Aa</span>Vocabulario</button>';
}
A.drawDock = drawDock;
Object.assign(A.actions, {
  hopen(b) {
    const k = b.dataset.k; S.hopen = S.hopen === k ? null : k;
    const q = S.game && S.game.qs[S.game.i]; if (q && k === 'ayuda' && S.hopen && !q.answered && !q.helpUsed) { q.helpUsed = 1; q.hints = (q.hints || 0) + 1; }
    drawDock();
  },
  hclose() { S.hopen = null; drawDock(); const b = document.querySelector('.hbtn'); if (b) b.focus(); },

});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.hopen && S.view === 'juego') { S.hopen = null; drawDock(); } });
